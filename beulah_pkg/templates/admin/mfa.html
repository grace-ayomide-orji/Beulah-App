<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Verify Admin Login - Beulah Foundation for Christ</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='images/favicon/favicon-96x96.png')}}" sizes="96x96" />
    <link rel="stylesheet" href="{{url_for('static', filename='assets/bootstrap/css/bootstrap.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='assets/fa/css/all.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='css_folder/admin_stylesheet.min.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.1/dist/sweetalert2.min.css">
</head>

<body>
    <div id="preloader" role="status" aria-live="polite">
        <div class="sk-three-bounce">
            <div class="sk-child sk-bounce1"></div>
            <div class="sk-child sk-bounce2"></div>
            <div class="sk-child sk-bounce3"></div>
        </div>
        <p>Loading, please wait...</p>
    </div>

    <div class="container-fluid content-container" id="content-container">
        <div class="row">
            <div class="col-12 admin-login-container">
                <form id="mfa-form" class="form" action="{{url_for('admin_mfa')}}" method="POST">
                    <p class="form-title">Verify Login</p>
                    <p class="text-muted text-center small">Enter the 6-digit code sent to the admin email.</p>

                    <div class="input-container">
                        <input type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter code" name="code" required>
                    </div>

                    <button type="submit" class="submit" id="mfa-submit-btn">Verify</button>
                    <div class="mfa-resend-row">
                        <span>Did not receive the code?</span>
                        <button type="button" class="mfa-resend-btn" id="mfa-resend-btn" data-url="{{ url_for('admin_mfa_resend') }}">Resend code</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}" defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.20/dist/sweetalert2.min.js"></script>
    <script nonce="{{ csp_nonce }}" defer src="{{url_for('static', filename='javascript_folder/admin_script.min.js')}}"></script>
    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function(){
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const mfaForm = document.getElementById('mfa-form');
            const submitBtn = document.getElementById('mfa-submit-btn');
            const resendBtn = document.getElementById('mfa-resend-btn');

            function startResendCooldown(seconds = 60) {
                let remaining = seconds;
                resendBtn.disabled = true;
                resendBtn.textContent = `Resend in ${remaining}s`;

                const timer = setInterval(() => {
                    remaining -= 1;
                    if (remaining <= 0) {
                        clearInterval(timer);
                        resendBtn.disabled = false;
                        resendBtn.textContent = 'Resend code';
                        return;
                    }

                    resendBtn.textContent = `Resend in ${remaining}s`;
                }, 1000);
            }

            mfaForm.addEventListener('submit', function(event){
                event.preventDefault();

                const code = document.querySelector('input[name="code"]').value.trim();

                if (!/^\d{6}$/.test(code)) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Invalid code',
                        text: 'Enter the 6-digit verification code.'
                    });
                    return;
                }

                // Prevent multiple submissions
                if (submitBtn.disabled) return;

                submitBtn.disabled = true;
                submitBtn.innerHTML ='Verifying...';

                const formData = new FormData();
                formData.append('code', code);

                fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            text: data.message,
                            timer: 1200,
                            showConfirmButton: false
                        });

                        window.location.href = data.redirect_url;
                        return;
                    }

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Verify';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message
                    });
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Verify';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'An unexpected error occurred. Please try again.'
                    });
                });
            });

            resendBtn.addEventListener('click', function(){
                if (resendBtn.disabled) return;

                resendBtn.disabled = true;
                resendBtn.textContent = 'Sending...';

                fetch(resendBtn.dataset.url, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            text: data.message,
                            timer: 1400,
                            showConfirmButton: false
                        });

                        startResendCooldown();
                        return;
                    }

                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend code';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message
                    }).then(() => {
                        if (data.redirect_url) {
                            window.location.href = data.redirect_url;
                        }
                    });
                })
                .catch(() => {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend code';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'An unexpected error occurred. Please try again.'
                    });
                });
            });
        });
    </script>
</body>

</html>
