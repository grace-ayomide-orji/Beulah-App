<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Forgot Admin Password - Beulah Foundation for Christ</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='images/favicon/favicon-96x96.png')}}" sizes="96x96" />
    <link rel="stylesheet" href="{{url_for('static', filename='assets/bootstrap/css/bootstrap.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='assets/fa/css/all.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='css_folder/admin_stylesheet.min.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.1/dist/sweetalert2.min.css">
</head>

<body>
    <div id="preloader" role="status" aria-live="polite">
        <div class="sk-three-bounce">
            <div class="sk-child sk-bounce1"></div>
            <div class="sk-child sk-bounce2"></div>
            <div class="sk-child sk-bounce3"></div>
        </div>
        <p>Loading, please wait...</p>
    </div>

    <div class="container-fluid content-container" id="content-container">
        <div class="row">
            <div class="col-12 admin-login-container">
                <form id="forgot-password-form" class="form" action="{{url_for('admin_forgot_password')}}" method="POST">
                    <p class="form-title">Reset Password</p>
                    <p class="text-muted text-center small">Enter your admin username. If it exists, a reset link will be sent to the admin email.</p>

                    <div class="input-container">
                        <input type="text" placeholder="Enter username" name="username" required>
                    </div>

                    <button type="submit" class="submit" id="forgot-submit-btn">Send reset link</button>

                    <div class="admin-login-secondary-link">
                        <a href="{{url_for('admin_login')}}">Back to login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.20/dist/sweetalert2.min.js" nonce="{{ csp_nonce }}"></script>
    <script defer src="{{url_for('static', filename='javascript_folder/admin_script.min.js')}}" nonce="{{ csp_nonce }}"></script>
    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function(){
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const form = document.getElementById('forgot-password-form');
            const submitBtn = document.getElementById('forgot-submit-btn');

            form.addEventListener('submit', function(event){
                event.preventDefault();

                const username = document.querySelector('input[name="username"]').value.trim();
                if (!username) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Username required',
                        text: 'Enter your admin username.'
                    });
                    return;
                }

                if (submitBtn.disabled) return;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                const formData = new FormData();
                formData.append('username', username);

                fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send reset link';

                    Swal.fire({
                        icon: data.success ? 'success' : 'error',
                        title: data.success ? 'Check email' : 'Error',
                        text: data.message
                    }).then(() => {
                        if (data.success && data.redirect_url) {
                            window.location.href = data.redirect_url;
                        }
                    });
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send reset link';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'An unexpected error occurred. Please try again.'
                    });
                });
            });
        });
    </script>
</body>

</html>
