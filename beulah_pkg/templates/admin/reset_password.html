<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Reset Admin Password - Beulah Foundation for Christ</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='images/favicon/favicon-96x96.png')}}" sizes="96x96" />
    <link rel="stylesheet" href="{{url_for('static', filename='assets/bootstrap/css/bootstrap.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='assets/fa/css/all.min.css')}}" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='css_folder/admin_stylesheet.min.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.1/dist/sweetalert2.min.css">
</head>

<body>
    <div id="preloader" role="status" aria-live="polite">
        <div class="sk-three-bounce">
            <div class="sk-child sk-bounce1"></div>
            <div class="sk-child sk-bounce2"></div>
            <div class="sk-child sk-bounce3"></div>
        </div>
        <p>Loading, please wait...</p>
    </div>

    <div class="container-fluid content-container" id="content-container">
        <div class="row">
            <div class="col-12 admin-login-container">
                <form id="reset-password-form" class="form" action="{{url_for('admin_reset_password', token=token)}}" method="POST">
                    <p class="form-title">Create New Password</p>
                    <p class="text-muted text-center small">Use at least 12 characters with uppercase, lowercase, and a number.</p>

                    <div class="input-container">
                        <input type="password" placeholder="New password" name="password" required autocomplete="new-password">
                    </div>

                    <div class="input-container">
                        <input type="password" placeholder="Confirm password" name="confirm_password" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="submit" id="reset-submit-btn">Reset password</button>
                </form>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.20/dist/sweetalert2.min.js" nonce="{{ csp_nonce }}"></script>
    <script defer src="{{url_for('static', filename='javascript_folder/admin_script.min.js')}}" nonce="{{ csp_nonce }}"></script>
    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function(){
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const form = document.getElementById('reset-password-form');
            const submitBtn = document.getElementById('reset-submit-btn');

            form.addEventListener('submit', function(event){
                event.preventDefault();

                const password = document.querySelector('input[name="password"]').value;
                const confirmPassword = document.querySelector('input[name="confirm_password"]').value;

                if (password !== confirmPassword) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Password mismatch',
                        text: 'The two passwords must match.'
                    });
                    return;
                }

                if (submitBtn.disabled) return;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting...';

                const formData = new FormData();
                formData.append('password', password);
                formData.append('confirm_password', confirmPassword);

                fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            text: data.message,
                            timer: 1500,
                            showConfirmButton: false
                        });

                        window.location.href = data.redirect_url;
                        return;
                    }

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset password';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message
                    }).then(() => {
                        if (data.redirect_url) {
                            window.location.href = data.redirect_url;
                        }
                    });
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset password';

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'An unexpected error occurred. Please try again.'
                    });
                });
            });
        });
    </script>
</body>

</html>
