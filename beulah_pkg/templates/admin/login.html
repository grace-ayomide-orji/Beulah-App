</head>

<body>
    <div id="preloader" role="status" aria-live="polite">
        <div class="sk-three-bounce">
            <div class="sk-child sk-bounce1"></div>
            <div class="sk-child sk-bounce2"></div>
            <div class="sk-child sk-bounce3"></div>
        </div>
        <p>Loading, please wait...</p>
    </div>
    
    <div class="container-fluid content-container" id="content-container">

        <div class="row">
            <div class="col-12 admin-login-container">

                <form id="login-form" class="form" action="{{url_for('admin_login')}}" method="POST">
                    <p class="form-title">Admin Login</p>

                    <div class="input-container">
                        <input type="text" placeholder="Enter username" name="username" required>
                    </div>

                    <div class="input-container">
                        <input id='password-input' type="password" placeholder="Enter password" name="password" required>
                        <span id="see-password" style="cursor: pointer;">
                            <i class="fa-regular fa-eye"></i>
                        </span>
                    </div>

                    <button type="submit" class="submit" id="login-submit-btn">
                         Log in
                    </button>

                    <div class="admin-login-secondary-link">
                        <a href="{{url_for('admin_forgot_password')}}">Forgot password?</a>
                    </div>

                </form>

            </div>
        </div>

    </div>





    <!-- Javascripts/jQuery starts here -->
    <script nonce="{{ csp_nonce }}" defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.20/dist/sweetalert2.min.js"></script>
    <script nonce="{{ csp_nonce }}" defer src="{{url_for('static', filename='javascript_folder/admin_script.min.js')}}"></script>
    <!-- Javascripts/jQuery ends here -->
    <script nonce="{{ csp_nonce }}">
        document.addEventListener('DOMContentLoaded', function(){
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const loginForm = document.getElementById('login-form')
            const seePwd = document.getElementById('see-password')
            const pwdInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('login-submit-btn');
    


        seePwd.addEventListener('click', function () {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                this.innerHTML = `<i class="fa-regular fa-eye-slash"></i>`;
            } else {
                pwdInput.type = 'password';
                this.innerHTML = `<i class="fa-regular fa-eye"></i>`;
            }
        });

        loginForm.addEventListener('submit', function(event){
            event.preventDefault();

            const username = document.querySelector('input[name="username"]').value.trim();
            const password = document.querySelector('input[name="password"]').value.trim();

            if (!username || !password){
                Swal.fire({
                    icon: "error",
                    title: 'Oops...',
                    text: 'The two fields cannot be empty',
                    showConfirmButton: true,
                    timer: 2000
                });

                return;
            }

            // Prevent multiple submissions
            if (submitBtn.disabled) return;
            submitBtn.disabled = true;
            submitBtn.innerHTML ='Logging in...';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch(this.action, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {

                if (data.success) {
                    Swal.fire({
                        icon: "success",
                        text: data.message,
                        showConfirmButton: false,
                        timer: 1200
                    });

                    window.location.href = data.redirect_url;
                    return;
                }

                // Login failed — allow another attempt
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in';

                Swal.fire({
                    icon: "error",
                    title: 'Error',
                    text: data.message,
                    showConfirmButton: true
                });
            })
            .catch(error => {
                console.error('Error:', error);

                // Network/error — allow retry
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in';

                Swal.fire({
                    icon: "error",
                    title: 'Error',
                    text: 'An unexpected error occurred. Please try again.',
                    showConfirmButton: true
                });
            });
        });

        })
    </script>

</body>

</html>
